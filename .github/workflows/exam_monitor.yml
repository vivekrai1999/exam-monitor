name: Rajasthan Exam Notice Monitor

on:
  schedule:
    # Mon-Sat, 9:00 AM to 7:30 PM IST (Peak office hours, every 5 minutes for real-time 3-5 min detection)
    - cron: '*/5 3-14 * * 1-6'
    # Mon-Sat, 7:30 PM to 10:30 PM IST (Evening release window, every 10 minutes)
    - cron: '*/10 14-17 * * 1-6'
    # Sunday standby check every 2 hours (9:30 AM to 7:30 PM IST)
    - cron: '0 4-14/2 * * 0'
  workflow_dispatch:

jobs:
  monitor:
    name: Poll Official Portals & Dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Ingest Latest Exam Notices (RPSC & RSSB)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          GEMINI_ENABLED: true
        run: npm run poll

      - name: Dispatch Notification Outbox (Telegram & FCM)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
        run: npm run outbox
